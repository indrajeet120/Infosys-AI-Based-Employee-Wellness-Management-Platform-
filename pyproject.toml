[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moodmentor"
version = "1.0.0"
description = "AI-Based Employee Wellness Management Platform — Advanced Emotion Analysis & Hybrid Recommendation Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Deepmind Advanced Agentic Coding Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.2.0",
    "nltk>=3.8.0",
    "reportlab>=3.6.0",
]

[project.scripts]
moodmentor = "moodmentor.cli:main"

[tool.setuptools]
packages = ["moodmentor", "services"]
